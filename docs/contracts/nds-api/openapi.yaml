openapi: "3.1.0"
info:
  title: "NDS (Nationale Datenbank Sport) – internal web API (reverse engineered, read-only)"
  version: "capture-2026-11-07"
  description: |-
      Unofficial description of the backend used by the NDS web UI (www.nds.baspo.admin.ch), derived from redacted browser captures.
      Not the official partner "Standard-API" (api.baspo.admin.ch/nds/api, Kaderbildung only).
      
      **Caveats**
      - Schemas reflect only what was observed: optional/required is unknown, fields seen only as `null` have unknown type, enums list observed values only.
      - Only read operations are included.
      - Using this API outside the official UI may violate the NDS terms of use; obtain BASPO approval before integrating.
      
      **Authentication**: browser session. Login via AGOV → Keycloak (`GET /perorgfin/oauth2/authorization/keycloak?clientRoute=…`), which sets the `SESSION` cookie. `cookiesession1` is a load-balancer cookie, `LANG` the UI language. No bearer token or CSRF header was observed on read requests.
servers:
  - url: "https://www.nds.baspo.admin.ch"
    description: "Production (web UI backend)"
security:
  - sessionCookie: []
tags:
  - name: "cadre"
    description: "Kaderbildung (cadre education): course plan, education structure, personal trainings and further education."
  - name: "document"
    description: "Documents attached to offers, camps, organisations."
  - name: "frontend"
    description: "Static UI texts (i18n)."
  - name: "material"
    description: "Rental material orders (Leihmaterial) for camps/courses."
  - name: "perorgfin"
    description: "Persons, organisations, finance (bank accounts, financial transactions). Also hosts the Keycloak OAuth2 login entry point."
  - name: "personal"
    description: "Per-user UI settings: table configs, start page, maintenance info."
  - name: "workflow"
    description: "Person tasks and notifications."
  - name: "youthtraining"
    description: "J+S Jugendausbildung: offers (Angebote), camps (Lager), courses, activities, participants, attendance."
