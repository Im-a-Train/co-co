name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Typecheck, unit tests, cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri 2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: npm ci
        run: npm ci

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # tauri::generate_context!() requires frontendDist (apps/desktop/dist) to exist at compile time.
      # (npm run build = full `tauri build`; the bundle job does that.)
      - name: Build frontend (vite only)
        run: npm run vite:build -w apps/desktop

      - name: cargo test coco-core (pure logic)
        working-directory: apps/desktop/src-tauri
        run: cargo test --manifest-path crates/coco-core/Cargo.toml

      - name: cargo test (tauri crate / workspace)
        working-directory: apps/desktop/src-tauri
        run: cargo test --workspace

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri 2 system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # windows-latest uses the MSVC toolchain by default (Build Tools + Windows SDK are preinstalled on the runner).
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: npm ci
        run: npm ci

      # No tagName/releaseName => tauri-action only builds, it does not create a GitHub release.
      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: co-co-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
            !apps/desktop/src-tauri/target/release/bundle/**/*.sh
          if-no-files-found: error
          retention-days: 14
