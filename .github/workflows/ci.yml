name: CI

# Default: checks + a Windows build only, all on the self-hosted runner.
#
# Windows build modes (repository variable WINDOWS_BUILD, Settings → Secrets and variables → Actions → Variables):
#   cross  (default) – cross-compile the Windows NSIS installer on the self-hosted LINUX runner
#                      with cargo-xwin (Tauri 2 "build Windows apps on Linux", experimental; NSIS only, no MSI).
#   native           – build natively on a self-hosted WINDOWS runner (labels: self-hosted, Windows, X64)
#                      that has VS Build Tools (C++ workload) + Windows SDK + WebView2. Produces NSIS + MSI.
#
# macOS / Linux bundles are opt-in: Actions → CI → "Run workflow" and tick the platform.
#
# Releases (ADR 0008): every push to main (= every merged PR) gets the next SemVer pre-release version
# `<base>-<channel>.<n>` (scripts/version.mjs next), the Windows build is stamped with it, and the
# `release` job publishes a GitHub pre-release + tag `v<version>` with the NSIS installer and the portable exe.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      linux:
        description: Also build Linux bundles (deb/AppImage, self-hosted Linux runner)
        type: boolean
        default: false
      macos:
        description: Also build macOS bundles (GitHub-hosted macos-latest, billed at 10x minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a running main build: it may be half-way through publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Tauri 2 Linux build deps + tools for the Windows cross-build (NSIS, llvm-rc/lld, clang-cl for ring).
  APT_PACKAGES: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev nsis lld llvm clang libdbus-1-dev pkg-config

jobs:
  check:
    name: Typecheck, unit tests, cargo test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - name: Ensure system packages
        shell: bash
        run: |
          missing=$(for p in $APT_PACKAGES; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done | xargs)
          if [ -z "$missing" ]; then echo "All system packages present."; exit 0; fi
          echo "Missing: $missing"
          if sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $missing
          else
            echo "::error::Runner lacks packages and passwordless sudo. Install once on the runner host: sudo apt-get install -y $missing"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: check

      - name: npm ci
        run: npm ci

      - name: Version manifests agree
        run: npm run version:check

      - name: Versioning script tests
        run: npm run test:scripts

      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # tauri::generate_context!() requires frontendDist (apps/desktop/dist) to exist at compile time.
      - name: Build frontend (vite only)
        run: npm run vite:build -w apps/desktop

      - name: cargo test coco-core (pure logic)
        working-directory: apps/desktop/src-tauri
        run: cargo test --manifest-path crates/coco-core/Cargo.toml

      - name: cargo test (tauri crate / workspace)
        working-directory: apps/desktop/src-tauri
        run: cargo test --workspace

  version:
    name: Release version
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to count the pre-release number

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(node scripts/version.mjs next)
            release=true
          else
            version=$(node scripts/version.mjs current)
            release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "### Version: \`$version\` (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  windows-cross:
    name: Windows installer (cross-compiled on self-hosted Linux)
    if: vars.WINDOWS_BUILD != 'native'
    needs: [check, version]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: windows-cross

      # cargo-xwin downloads the MSVC CRT + Windows SDK (Microsoft licence terms apply) and caches them in ~/.cache/cargo-xwin.
      - name: Ensure cargo-xwin
        shell: bash
        run: command -v cargo-xwin >/dev/null || cargo install --locked cargo-xwin

      - name: npm ci
        run: npm ci

      - name: Stamp version ${{ needs.version.outputs.version }}
        if: needs.version.outputs.release == 'true'
        run: node scripts/version.mjs set ${{ needs.version.outputs.version }}

      - name: Build NSIS installer (x86_64-pc-windows-msvc)
        run: npm run tauri -w apps/desktop -- build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect installer + portable exe
        shell: bash
        run: |
          out=release-files; rm -rf "$out"; mkdir -p "$out"
          rel=apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release
          cp "$rel"/bundle/nsis/*.exe "$out"/
          cp "$rel"/co-co.exe "$out/co-co_${{ needs.version.outputs.version }}_x64-portable.exe"
          ls -l "$out"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: co-co-windows-x64
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  windows-native:
    name: Windows installers (native, self-hosted Windows)
    if: vars.WINDOWS_BUILD == 'native'
    needs: [check, version]
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: windows-native

      - name: npm ci
        run: npm ci

      - name: Stamp version ${{ needs.version.outputs.version }}
        if: needs.version.outputs.release == 'true'
        run: node scripts/version.mjs set ${{ needs.version.outputs.version }}

      # MSI (WiX) rejects non-numeric pre-release versions such as 0.1.0-alpha.3, so releases ship NSIS only.
      - name: Build Windows installers
        run: npm run tauri -w apps/desktop -- build --bundles ${{ needs.version.outputs.release == 'true' && 'nsis' || 'nsis,msi' }}

      - name: Collect installers + portable exe
        shell: bash
        run: |
          out=release-files; rm -rf "$out"; mkdir -p "$out"
          rel=apps/desktop/src-tauri/target/release
          cp "$rel"/bundle/nsis/*.exe "$out"/
          cp "$rel"/bundle/msi/*.msi "$out"/ 2>/dev/null || true
          cp "$rel"/co-co.exe "$out/co-co_${{ needs.version.outputs.version }}_x64-portable.exe"
          ls -l "$out"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: co-co-windows-x64
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [version, windows-cross, windows-native]
    # One of the two Windows jobs is always skipped, hence always() + explicit result checks.
    if: >-
      always() && needs.version.outputs.release == 'true' &&
      (needs.windows-cross.result == 'success' || needs.windows-native.result == 'success')
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    steps:
      # Self-hosted runners keep their workspace between runs: use a fresh, per-run directory so no
      # files from earlier builds end up in the release.
      - name: Prepare clean download directory
        shell: bash
        run: |
          dir="${{ runner.temp }}/release-files-${{ github.run_id }}"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "RELEASE_DIR=$dir" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: co-co-windows-x64
          path: ${{ env.RELEASE_DIR }}

      - name: Create tag + pre-release v${{ needs.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: co-co ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.RELEASE_DIR }}/*
          body: |
            **Alpha-Version** – nur für Tests, Daten können sich zwischen Versionen ändern.

            **Download (Windows 10/11, x64):**
            - `co-co_${{ needs.version.outputs.version }}_x64-setup.exe` – Installer (empfohlen, Startmenü + Deinstallation)
            - `co-co_${{ needs.version.outputs.version }}_x64-portable.exe` – direkt startbar ohne Installation (benötigt WebView2, bei Windows 10/11 vorinstalliert)

            Die Dateien sind nicht signiert; Windows SmartScreen zeigt beim ersten Start eine Warnung („Weitere Informationen“ → „Trotzdem ausführen“).

  linux:
    name: Linux bundles (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.linux
    needs: check
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: linux
      - run: npm ci
      - run: npm run tauri -w apps/desktop -- build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: co-co-linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS bundles (opt-in, GitHub-hosted)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: macos
      - run: npm ci
      - run: npm run tauri -w apps/desktop -- build
      - uses: actions/upload-artifact@v4
        with:
          name: co-co-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
