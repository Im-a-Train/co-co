# PBS milestones for the deadline radar (source: Hering, https://hering.scout.ch/de).
# Hering has no API. ALL offsets below are UNVERIFIED defaults (guidance derived from typical PBS camp
# planning, not confirmed by a PBS owner); every entry therefore carries confidence 'unverified' and the
# UI labels it «unbestätigt». Change confidence to 'verified' only after a PBS owner confirmed an entry.
# offsetDays: days relative to camp start (anchor 'start') or camp end (anchor 'end'); negative = before.
# The J+S/LAGER milestones live in packs/jslst/milestones.yaml.
# Existing deadlines (NDS T-30 / T+30, Leihmaterial, Landeskarten, Lagerbewilligung T-21) are NOT repeated.
id: pbs-hering
name: PBS-Meilensteine (Hering)
version: "2026.2"
milestones:
  - id: lagerplatz-reserviert
    title: Lagerplatz reserviert
    description: Lagerplatz und Lagerhaus sind verbindlich reserviert (Vertrag unterschrieben).
    anchor: start
    offsetDays: -180
    module: pbs
    confidence: unverified
    source: { title: Hering, url: "https://hering.scout.ch/de" }
  - id: grobprogramm-coach
    title: Grobprogramm an den Coach
    description: Das Grobprogramm ist erstellt und dem Coach zur Besprechung zugestellt.
    anchor: start
    offsetDays: -75
    module: pbs
    confidence: unverified
    source: { title: Hering, url: "https://hering.scout.ch/de" }
  - id: lagermeldung-kantonalverband
    title: Lagermeldung an Abteilungsleitung und Kantonalverband
    description: Die PBS-Lagermeldung ist an die Abteilungsleitung und den Kantonalverband gesendet.
    anchor: start
    offsetDays: -60
    module: pbs
    confidence: unverified
    source: { title: Hering, url: "https://hering.scout.ch/de" }
  - id: elterninformation
    title: Elterninformation (Lagerbrief) verschickt
    description: Eltern und Teilnehmende haben Lagerbrief und Anmeldeunterlagen erhalten.
    anchor: start
    offsetDays: -42
    module: pbs
    confidence: unverified
    source: { title: Hering, url: "https://hering.scout.ch/de" }
  - id: sicherheitskonzept
    title: Sicherheitskonzept erstellt
    description: Sicherheitskonzept inklusive Notfallorganisation liegt vor.
    anchor: start
    offsetDays: -28
    module: pbs
    confidence: unverified
    source: { title: Hering, url: "https://hering.scout.ch/de" }
  - id: lagerdossier-coach
    title: Detailprogramm und Lagerdossier an den Coach
    description: Detailprogramm und Lagerdossier sind dem Coach zugestellt.
    anchor: start
    offsetDays: -14
    module: pbs
    confidence: unverified
    source: { title: Hering, url: "https://hering.scout.ch/de" }
  - id: lagerbericht
    title: Lagerbericht abgeschlossen
    description: Der Lagerbericht ist geschrieben und verteilt.
    anchor: end
    offsetDays: 14
    module: pbs
    confidence: unverified
    source: { title: Hering, url: "https://hering.scout.ch/de" }
  - id: lagerabrechnung
    title: Lagerabrechnung abgeschlossen
    description: Die Lagerabrechnung ist erstellt und von der Revision geprüft.
    anchor: end
    offsetDays: 60
    module: pbs
    confidence: unverified
    source: { title: Hering, url: "https://hering.scout.ch/de" }
