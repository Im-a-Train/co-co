# J+S / LS/T milestones for the deadline radar (catalog v2 §9). The PBS milestones live in packs/pbs/milestones.yaml.
# Anchors: start | end | leihmaterialDelivery | landeskartenDelivery | lastActivity | firstSb | outageOrderBy.
# offsetDays = latest date; offsetEarliestDays = start of a recommended range (informational).
# Confidence `unverified` = only the 2014 LAGER brochure (labelled «unbestätigt» in the radar).
id: jslst-milestones
name: J+S-Meilensteine (Lagersport/Trekking)
version: "2026.2"
milestones:
  - id: M-JS-PROGRAMM-NDS
    title: Definitives Lagerprogramm in der NDS hochgeladen
    description: Das definitive Lagerprogramm ist bis zum Abschluss des Angebots in der NDS hochgeladen.
    anchor: lastActivity
    offsetDays: 30
    module: js
    confidence: verified
    sources: [{ key: WEB-L, page: "Lagerprogramm" }]
  - id: M-JS-LIEFERUNTERBRUCH
    title: Bestellschluss Lieferunterbruch Leihmaterial 2026/27
    description: Wegen des Systemwechsels im Armeelogistikcenter wird zwischen dem 11.12.2026 und 10.01.2027 kein Leihmaterial ausgeliefert oder abgeholt. Bestellschluss für diesen Zeitraum ist der 04.11.2026.
    anchor: outageOrderBy
    offsetDays: 0
    module: js
    confidence: verified
    sources: [{ key: WEB-LU, page: "" }]
  - id: M-LST-SB-BEWILLIGUNG
    title: "Sicherheitsbereich: Expertenbewilligung eingeholt"
    description: Die Bewilligung der J+S-Expertin oder des J+S-Experten liegt vor der ersten Aktivität im Sicherheitsbereich vor. Empfohlen ist ein Puffer von 14 Tagen.
    anchor: firstSb
    offsetDays: -14
    module: lst
    confidence: best-practice
    sources: [{ key: WEB-C, page: "" }]
  - id: M-LST-PROGRAMM-COACH
