    page: "«Lagerdauer» (Art. 14 Abs. 1 und 6 VSpoFöP)"
    binding: true
  - key: WEB-L
    page: "«Voraussetzungen»"
    binding: true
  - key: TOOL-V
    page: "«Das J+S-Lager»"
    binding: true
  - key: MAN
    page: "S. 21"
    binding: true
  - key: PBS27
    page: "Folien 5–6"
