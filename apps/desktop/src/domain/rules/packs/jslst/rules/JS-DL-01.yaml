id: JS-DL-01
version: 1.2.0
module: js
status: active
title: "NDS-Anmeldung mindestens 30 Tage vor Lagerbeginn"
description: "Das Lager ist spätestens 30 Tage vor Lagerbeginn in der NDS angemeldet. Die Frist gilt auch, wenn das Lager später zu einem bestehenden Angebot hinzugefügt wird (gleiche Frist für die Nachmeldung). Ist das Anmeldedatum aus dem NDS-Protokoll (Einreichung) übernommen, wird eine verspätete Anmeldung erkannt; ein übernommenes Bewilligungsdatum allein genügt dafür nicht."
message: "NDS-Anmeldung: Frist am {due} überschritten, Anmeldung nicht bestätigt{src}"
messageVariants:
  late: "NDS-Anmeldung: Anmeldung erfolgte am {on}, Frist war {due}: Bewilligung nicht garantiert{src}"
  soonOne: "NDS-Anmeldung: Frist am {due} (noch {left} Tag){src}"
  soonMany: "NDS-Anmeldung: Frist am {due} (noch {left} Tage){src}"
feedbackText: "Für die NDS-Anmeldung (Frist {due}) brauche ich alle Angaben zum Lager von euch. Fehlt mir noch etwas, schickt es mir bitte so bald wie möglich."
severity: must
confidence: verified
scope: camp
validFrom: 2026-01-01
inputs: [coachInputs, params, nds]
params: [js.ndsRegistrationLeadDays, js.deadlineSoonDays]
tags: [frist, nds]
sources:
  - { key: WEB-C, page: "«Anmeldefrist für J+S-Angebote» (Art. 22 SpoFöV, Art. 58 VSpoFöP)", binding: true }
