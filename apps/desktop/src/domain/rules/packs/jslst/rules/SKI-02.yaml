title: "Skifahren im freien Gelände"
description: "Fahren im freien Gelände ist im Rahmen von J+S nur pistennah, niveau- und verhältnisangepasst und mässig steil erlaubt, nach Absprache mit dem Pisten- und Rettungsdienst. Steileres Gelände braucht Notfallausrüstung und den J+S-Sicherheitszusatz Freeride. Erkennung über Stichwörter (Heuristik)."
message: "«{activity}» enthält «{term}» (freies Gelände), die Sicherheitsüberlegungen nennen aber weder Steilheit noch Absprache mit dem Pisten- und Rettungsdienst. Ohne Notfallausrüstung nur pistennahes, mässig steiles Gelände unter {max}°; bis {maxFreeride}° nur mit Notfallausrüstung (LVS, Schaufel, Sonde) und J+S-Sicherheitszusatz Freeride."
severity: should
confidence: heuristic
scope: activity
validFrom: 2026-01-01
