id: JS-DAY-01
version: 2.0.0
module: lst
status: active
title: "Gültiger J+S-Lagertag"
description: "Ein Lagertag zählt für J+S, wenn mindestens zwei J+S-Einheiten mit zusammen mindestens 240 Minuten stattfinden (ab 2027 zusätzlich mit ausreichend Bewegungszeit). Ein Tag, der die Kriterien nicht erfüllt, gilt als trainingsfreier Tag. Anreise- und Abreisetag beurteilt JS-DAY-04."
message: "{date} zählt nicht als J+S-Tag ({minutes} min J+S-Aktivität in {units} Einheit(en); nötig {minMinutes} min in mindestens {minUnits} Einheiten). Er gilt als trainingsfreier Tag."
messageVariants:
  bwz: "{date} zählt nicht als J+S-Tag: {minutes} min J+S-Aktivität in {units} Einheit(en) genügen, aber die Bewegungszeit beträgt nur {bwz} min (nötig {minBwz} min). Er gilt als trainingsfreier Tag."
severity: should
confidence: verified
scope: day
validFrom: 2026-01-01
inputs: [mapping, activityTags, params]
params: [js.minDayMinutes, js.minDayUnits, js.minUnitMinutes, js.minGapMinutes, js.minBwzDayMinutes, js.minBwzActivityMinutes]
tags: [lagertag]
