title: "Sicherheitsbereich ohne Expertenbewilligung"
description: "Jede Aktivität im Sicherheitsbereich Berg, Wasser oder Winter muss vor der Durchführung durch eine J+S-Expertin oder einen J+S-Experten LS/T bewilligt werden. Gilt auch für das Lager ohne wintersichere Zufahrt im Winter."
message: "«{activity}» ist im Sicherheitsbereich {area}. Jede solche Aktivität muss vor der Durchführung durch eine J+S-Expertin / einen J+S-Experten LS/T mit Zusatz im Sicherheitsbereich {area} bewilligt werden – Bewilligung nicht erfasst."
