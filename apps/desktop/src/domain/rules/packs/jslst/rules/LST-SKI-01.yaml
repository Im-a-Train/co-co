status: active
title: "Skifahren: Leitung mit J+S-Anerkennung"
description: "Skifahren und Snowboarden haben bei J+S besondere Sicherheitsbestimmungen. Im LS/T-Lager sind sie ein ergänzender Bewegungsblock (EBB A), den eine Person mit J+S-Anerkennung Skifahren bzw. Snowboard oder einer entsprechenden Ausbildung (z. B. Skischule) leitet. co-co sucht diese Leitung in Sicherheitsüberlegungen, Ablauf und Notizen (Stichwörter); die Anerkennung selbst kann co-co nicht prüfen."
message: "«{activity}» ist Skifahren/Snowboarden («{term}»), aber es ist keine Leitung mit J+S-Anerkennung Skifahren/Snowboard oder Skischule festgehalten. Skifahren hat bei J+S besondere Sicherheitsbestimmungen und darf im Lager nur von einer dafür qualifizierten Person geleitet werden."
feedbackText: "Bei «{activity}» fehlt, wer das Skifahren leitet. Bitte haltet in den Sicherheitsüberlegungen fest, wer eine J+S-Anerkennung Skifahren/Snowboard hat oder welche Skischule ihr beizieht."
severity: should
confidence: heuristic
scope: activity
validFrom: 2026-01-01
inputs: [keywords, activityTags]
keywords: [SKI, SKI_LEAD]
tags: [sicherheit, winter, ski, leitung]
