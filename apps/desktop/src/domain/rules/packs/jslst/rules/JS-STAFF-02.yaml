id: JS-STAFF-02
version: 1.1.0
module: js
status: active
title: "Mindestens zwei J+S-Leitende"
description: "Ein J+S-Lager braucht mindestens zwei J+S-Leitende mit gültiger Anerkennung in der angemeldeten Sportart. Bei Lagersport/Trekking zählt co-co nach MiData (Anerkennung Leiter LS/T), sonst nach deiner Angabe; bei Skifahren und anderen Sportarten immer nach deiner Angabe (MiData führt keine Anerkennung Skifahren)."
message: "Es sind {count} J+S-Leitende mit gültiger Anerkennung in der Sportart des Lagers erfasst – nötig sind mindestens {min}."
messageVariants:
  missing: "Anzahl J+S-Leitende unbekannt – MiData verbinden oder Anzahl erfassen."
feedbackText: "Für J+S braucht das Lager mindestens {min} J+S-Leitende mit gültiger Anerkennung. Wie viele habt ihr aktuell?"
severity: must
confidence: verified
scope: camp
validFrom: 2026-01-01
inputs: [midata, coachInputs, params]
params: [js.minLeaders]
tags: [leitung]
sources:
  - key: LEITFADEN
    page: "«Lagerleitung» (Art. 12 VSpoFöP)"
    quote: "mindestens zwei J+S-Leiterinnen bzw. -Leiter, die in den angemeldeten Sportarten sowie Zielgruppen eine Leiteranerkennung … im Status «gültig» aufweisen"
    binding: true
  - { key: WEB-L, page: "«Leitung»", binding: true }
  - { key: PBS27, page: "Folie 9" }
